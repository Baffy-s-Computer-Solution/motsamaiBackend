apiVersion: apps/v1
kind: Deployment
metadata:
  name: easygo-backend
  namespace: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: easygo-backend
  template:
    metadata:
      labels:
        app: easygo-backend
    spec:
      containers:
      - name: backend
        image: ${{ secrets.DOCKERHUB_USERNAME }}/easygo-backend:latest
        ports:
        - containerPort: 4000
        envFrom:
        - configMapRef:
            name: backend-config
        - secretRef:
            name: backend-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 4000
          initialDelaySeconds: 15
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: easygo-backend-service
  namespace: production
spec:
  selector:
    app: easygo-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 4000
  type: ClusterIP